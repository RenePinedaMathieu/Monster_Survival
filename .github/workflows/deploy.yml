name: Export Godot + Deploy to Vercel

# Cuándo se dispara: cada push a main, o manualmente desde la pestaña
# "Actions" de GitHub.
on:
  push:
    branches: [main]
    # Docs-only cambios no gatillan el deploy — ahorra minutos del
    # workflow y evita redeploys idénticos. Cualquier .md, el
    # .gitignore y LICENSE quedan fuera. Cambios de código o assets
    # sí siguen disparando.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  EXPORT_PRESET: Web

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Godot editor
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Download export templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import Godot assets (first pass)
        run: godot --headless --import || true

      - name: Export project to Web
        run: |
          mkdir -p build
          godot --headless --export-release "${EXPORT_PRESET}" build/index.html

      # Inyectamos meta tags mobile + CSS de canvas fullscreen así el
      # juego llena la pantalla en teléfono y no permite zoom accidental.
      # Godot expone el <head> pero por default no incluye viewport
      # scale-lock ni apple-mobile-web-app-capable.
      - name: Patch index.html for mobile
        run: |
          python3 << 'PY'
          import re, pathlib
          p = pathlib.Path("build/index.html")
          html = p.read_text(encoding="utf-8")
          inject = (
            '<meta name="viewport" content="width=device-width, initial-scale=1, '
            'maximum-scale=1, user-scalable=no, viewport-fit=cover" />\n'
            '<meta name="apple-mobile-web-app-capable" content="yes" />\n'
            '<meta name="mobile-web-app-capable" content="yes" />\n'
            '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n'
            '<style>html,body{margin:0;padding:0;width:100%;height:100%;'
            'overflow:hidden;background:#000;touch-action:none;'
            'overscroll-behavior:none;-webkit-user-select:none;user-select:none;}'
            '#canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;'
            'image-rendering:crisp-edges;}</style>\n'
          )
          # Reemplazamos el primer viewport si existía, o inyectamos antes del </head>
          if re.search(r'<meta[^>]+name=["\']viewport["\']', html):
            html = re.sub(r'<meta[^>]+name=["\']viewport["\'][^>]*>', '', html, count=1)
          html = html.replace("</head>", inject + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          print("[patch] index.html patched for mobile")
          PY

      - name: Copy Vercel headers config into build
        run: |
          cat > build/vercel.json <<'EOF'
          {
            "framework": null,
            "buildCommand": null,
            "outputDirectory": ".",
            "installCommand": null,
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" },
                  { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }
                ]
              }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # `vercel deploy` con --scope apunta explícitamente al team
      # y --cwd al build. No dependemos de vercel link ni pull —
      # el token identifica al usuario, --scope identifica al team,
      # y en el team elegimos el proyecto por su nombre (--name).
      - name: Deploy to production
        run: |
          vercel deploy build \
            --prod \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=renepinedamathieus-projects \
            --name=i-hear-you
